[project]
name = "document-events-outbox"
version = "0.1.0"
description = "A transactional outbox demo with PostgreSQL and RabbitMQ"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "SQLAlchemy==2.0.41",
    "psycopg[binary]==3.2.9",
    "pika==1.3.2",
    "alembic==1.16.1",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.test.dependencies]
pytest = "8.3.5"
